# SMTP Configuration for AutoHeal Platform
# For Gmail, use an App Password (not your primary password).
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true

# Replace these with your actual credentials!
# Note: For Brevo HTTP API, mail.password is used to store the Brevo API Key
mail.user=autohealtool@gmail.com
mail.password=YOUR_BREVO_API_KEY_HERE
